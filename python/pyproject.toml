[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "orgdatacore"
# Version is derived from the git tag by hatch-vcs (see [tool.hatch.version]).
# Release tags are prefixed `python-v` (e.g. python-v2.0.0) so they do not collide
# with the repo's Go tags in this monorepo. See RELEASING.md.
dynamic = ["version"]
description = "Python library for organizational data management"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Continuous Release Tooling - Red Hat"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
keywords = ["organizational-data", "employees", "teams", "organizations"]

dependencies = [
    "pydantic>=2.0",
    # Pre-1.0 and tightly coupled to our model shape, so cap at the next minor:
    # a 0.2.0 may be breaking (SemVer 0.x) and the schema's additive-only gate
    # (OCPCRT-662) isn't enforced yet. Raise deliberately when adopting 0.2.
    "orgindex-schema>=0.1.0,<0.2.0",
]

[project.optional-dependencies]
gcs = [
    "google-cloud-storage>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/openshift-eng/cyborg-data/tree/main/python"
Repository = "https://github.com/openshift-eng/cyborg-data"
Changelog = "https://github.com/openshift-eng/cyborg-data/blob/main/python/CHANGELOG.md"
Issues = "https://github.com/openshift-eng/cyborg-data/issues"

[tool.hatch.version]
source = "vcs"

# Monorepo: the Python package lives in python/, the Go module in go/. The git root
# is one level up, so point setuptools-scm there with root = "..". Match only the
# python-prefixed tags so Go tags (and the legacy v0.1.0 tag) never drive this
# package's version. The default tag_regex strips the `python-` prefix.
[tool.hatch.version.raw-options]
root = ".."
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "python-v*"]
# Don't hard-fail a build in a checkout without python-v* tags (e.g. a shallow CI
# clone); real releases always build from a tag, which takes precedence.
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["orgdatacore"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
packages = ["orgdatacore"]
exclude = ["examples", "tests"]

[[tool.mypy.overrides]]
module = "google.cloud.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "orgdatacore._internal.testing.*"
ignore_errors = true

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py311"
lint.select = ["E", "F", "I", "N", "W", "UP"]
lint.ignore = ["E501"]
