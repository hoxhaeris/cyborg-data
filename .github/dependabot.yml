version: 2
updates:
  # Keep GitHub Actions pinned by SHA and up to date (security-relevant).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    # One batched PR per run instead of one per action.
    groups:
      github-actions:
        patterns: ["*"]
    # Let a release settle before proposing it. (semver-*-days is not supported
    # for the github-actions ecosystem, so a single default is used.)
    cooldown:
      default-days: 7

  # Watch the Python package's runtime dependencies (pydantic, orgindex-schema).
  # Dev tooling is deliberately not tracked: those updates only widen the dev upper
  # bounds in pyproject without refreshing uv.lock, which breaks `uv lock --check`;
  # we bump them by hand (cap + lock together) when adopting newer linting.
  - package-ecosystem: pip
    directory: "/python"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      python:
        patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "ruff"
      - dependency-name: "mypy"
      - dependency-name: "pytest"
